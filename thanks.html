<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>送信が完了しました | 前田健太 公式サイト</title>
<style>
:root{--c-bg:#f4faff;            /* やわらかい空色の背景 */
    --c-ink:#1a2741;            /* ややブルー寄りの濃紺で文字 */
    --c-sub:#465670;
    --c-muted:#7888a0;
    --c-line:#dbe7f5;           /* 罫線も淡い水色 */
    --c-accent:#0EA5E9;         /* メイン：明るい空色（sky-500） */
    --c-accent-ink:#0369a1;     /* 濃いめの青（sky-700） */
    --c-accent-soft:#e0f2fe;    /* タグ等の極淡い水色（sky-100） */
    --c-accent-2:#fde047;       /* サブ：やわらかいレモン色（強調用） */
    --c-card:#ffffff;
    --radius:14px;              /* 少し丸く */
    --shadow:0 1px 2px rgba(15,90,160,.06),0 10px 28px rgba(15,90,160,.10);
    --maxw:1080px;}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  background:var(--c-bg,#f8fafc);color:var(--c-ink,#0f172a);
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.box{background:#fff;border:1px solid var(--c-line,#e2e8f0);border-radius:18px;
  max-width:520px;width:100%;padding:48px 36px;text-align:center;
  box-shadow:0 1px 2px rgba(17,24,39,.04),0 16px 40px rgba(17,24,39,.06)}
.mark{width:64px;height:64px;border-radius:50%;background:#dcfce7;color:#166534;
  display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 22px}
h1{font-size:23px;font-weight:800;letter-spacing:.02em;margin-bottom:14px}
p{color:var(--c-sub,#475569);font-size:14.5px;line-height:1.9}
.btn{display:inline-block;margin-top:28px;padding:12px 26px;border-radius:999px;
  background:var(--c-accent,#1d4ed8);color:#fff;text-decoration:none;font-weight:700;font-size:14px}
.note{margin-top:22px;font-size:12.5px;color:var(--c-muted,#64748b);line-height:1.8}
</style>
</head>
<body>
  <div class="box">
    <div class="mark">✓</div>
    <h1>お問い合わせを送信しました</h1>
    <p>
      この度はご連絡いただき、ありがとうございます。<br>
      内容を確認のうえ、数日以内に返信いたします。
    </p>
    <a class="btn" href="/">トップページに戻る</a>
    <p class="note">
      しばらく経っても返信が届かない場合は、<br>
      お手数ですが contact@mathmathsan.com まで直接ご連絡ください。
    </p>
  </div>
</body>
</html>
